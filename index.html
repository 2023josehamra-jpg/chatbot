<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor-principal">
        <header class="header-bot">
            <h1>⚽ chatbot ⚽</h1>
            <p>¡El bot futbolero más divertido y certero!</p>
        </header>

        <!-- Zona de mensajes según boceto -->
        <main class="zonas de mensajes" id="zonas-de-mensajes" aria-live="polite">
            <!-- Los mensajes del bot y usuario se cargarán dinámicamente aquí -->
        </main>

        <!-- Ingreso de opciones según boceto -->
        <footer class="ingresos de opciones" id="ingresos-de-opciones">
            <!-- Los botones de opciones o inputs se cargarán dinámicamente aquí -->
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
